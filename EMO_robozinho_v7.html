async function requestMicPermission(){
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('getUserMedia indisponível');
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    stream.getTracks().forEach(t=>t.stop());
    showSub('🎤 Microfone liberado!',1);
    listen();
  }catch(e){
    showSub('🎤 O Chrome bloqueou o microfone. Abra este HTML por localhost/HTTPS e permita o microfone.',1);
  }
}

const visionBox=document.getElementById('visionBox');

const visionStatus=document.getElementById('visionStatus');
let visionStream=null,visionModel=null,visionOn=false,visionBusy=false,visionTimer=0,visionLast=new Map();

function visionMsg(text, emotion='curious'){
  showSub(text,1); emo(emotion); setTimeout(()=>{if(!talk&&!asleep)visionStatus.textContent='👁️ '+text},50);
}
async function loadVisionModel(){
  if(visionModel)return visionModel;
  if(!window.cocoSsd)throw new Error('modelo não carregado');
  visionStatus.textContent='👁️ Carregando visão...';
  visionModel=await cocoSsd.load();
  return visionModel;
}
function drawVision(preds){
  const w=visionVideo.videoWidth||640,h=visionVideo.videoHeight||480;
  visionCanvas.width=w;visionCanvas.height=h;
  const q=visionCanvas.getContext('2d');q.clearRect(0,0,w,h);
  q.font='bold 14px system-ui';q.lineWidth=3;
  for(const p of preds){
    const [x,y,bw,bh]=p.bbox;
    q.strokeStyle='#19d3f0';q.strokeRect(x,y,bw,bh);
    q.fillStyle='#19d3f0';q.fillRect(x,y-22,Math.max(80,q.measureText(p.class).width+18),22);
    q.fillStyle='#001018';q.fillText(p.class+' '+Math.round(p.score*100)+'%',x+6,y-6);
  }
}
async function visionDetect(){
  if(!visionOn||visionBusy||!visionModel||visionVideo.readyState<2)return;
  visionBusy=true;
  try{
    const preds=await visionModel.detect(visionVideo,20,.55);
    drawVision(preds);
    const persons=preds.filter(p=>p.class==='person'&&p.score>.60).length;
    const objects=preds.filter(p=>p.class!=='person'&&p.score>.60);
    const names=[...new Set(objects.map(p=>p.class))];
    visionStatus.textContent=persons?`👁️ ${persons} pessoa(s) • ${names.slice(0,4).join(', ')||'sem objeto'}`:`👁️ ${names.slice(0,5).join(', ')||'procurando...'}`;
    const key=(persons?'person:'+persons:'')+'|'+names.slice(0,5).join(',');
    const old=visionLast.get('scene');
    if(key!==old&&key&&key!=='|'){
      visionLast.set('scene',key);
      if(persons&&old?.indexOf('person:')!==0)visionMsg(persons===1?'Tem alguém aí! 👀':'Tem gente aí! 👀','surprised');
      else if(names.length){
        const n=names[0];
        const pt={'cell phone':'celular',laptop:'notebook',book:'livro',bottle:'garrafa',cup:'copo',chair:'cadeira',backpack:'mochila',keyboard:'teclado',mouse:'mouse',tv:'televisão',remote:'controle',pizza:'pizza',ball:'bola',umbrella:'guarda-chuva',cat:'gato',dog:'cachorro',bird:'pássaro'}[n]||n;
        visionMsg('Eu estou vendo '+pt+'!','curious');
      }
    }
  }catch(e){visionStatus.textContent='👁️ Erro na visão';}
  finally{visionBusy=false}
}
async function startVision(){
  if(visionOn)return;
  try{
    if(!window.isSecureContext && location.hostname!=='localhost')throw new Error('contexto inseguro');
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('câmera indisponível');
    visionStatus.textContent='👁️ Pedindo acesso à câmera...';
    visionStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'user'},width:{ideal:640},height:{ideal:480}},audio:false});
    visionVideo.srcObject=visionStream; await visionVideo.play();
    await loadVisionModel();
    visionOn=true;visionBox.classList.add('on');visionStatus.textContent='👁️ Visão ativa';
    clearInterval(visionTimer);visionTimer=setInterval(visionDetect,1200);visionDetect();
    say('Minha visão está ligada! Eu consigo procurar pessoas e objetos.');
  }catch(e){
    visionOn=false;visionBox.classList.remove('on');
    visionStatus.textContent='👁️ Câmera bloqueada';
    showSub(window.isSecureContext||location.hostname==='localhost'?'Preciso da permissão da câmera para enxergar.':'Abra o HTML por localhost/HTTPS para o Chrome permitir a câmera.',1);
  }
}
function stopVision(){
  visionOn=false;clearInterval(visionTimer);
  if(visionStream)visionStream.getTracks().forEach(t=>t.stop());
  visionStream=null;visionVideo.srcObject=null;visionBox.classList.remove('on');
  visionStatus.textContent='👁️ Visão desligada';
}
function toggleVision(){visionOn?stopVision():startVision()}
